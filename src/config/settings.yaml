evaluation:
  metrics:
    - "true_positives"
    - "false_positives"
    - "true_negatives"
    - "false_negatives"
    - "recall"
    - "precision"
    - "f1_score"
    - "false_positive_rate"
    - "detection_latency_p50_us"
    - "detection_latency_p95_us"
    - "detection_latency_p99_us"
    - "messages_per_second"
    - "message_loss_rate"
    - "cpu_usage_percent"
    - "memory_usage_mb"
    - "evidence_integrity_verified"
  thresholds:
    # HIPÓTESIS / CRITERIOS DE ACEPTACIÓN - NO RESULTADOS GARANTIZADOS
    target_recall: 0.90
    target_precision: 0.95
    target_fpr: 0.05
    target_latency_p99_us: 500000  # 500ms realista para Python; µs requiere C/Rust
    target_throughput_mps: 100
  reporting:
    output_format: "json"
    include_confusion_matrix: true
    include_roc_data: false  # Detector determinista, no probabilístico