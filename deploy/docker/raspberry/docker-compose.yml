services:
  pi-mllp-detector:
    container_name: pi-mllp-detector
    build:
      context: ../../..
      dockerfile: deploy/docker/raspberry/Dockerfile
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      LAB_AUTHORIZED: "YES"
      # wlan0: la Pi del lab esta por Wi-Fi. Si se cablea, CAPTURE_INTERFACE=eth0.
      CAPTURE_INTERFACE: "${CAPTURE_INTERFACE:-wlan0}"
      WATO_IP: "${WATO_IP:-192.168.5.114}"
      MLLP_PORT: "${MLLP_PORT:-1550}"
      CAPTURE_OUTDIR: "/lab_output"
      # Vacio por defecto (campaña externa: Kali debe dar R-NET-001).
      # Campaña interna: EXTRA_ALLOWED_IPS=<IP de Kali>. La .114 ya esta en el
      # baseline, no hace falta autorizarla.
      EXTRA_ALLOWED_IPS: "${EXTRA_ALLOWED_IPS:-}"
      CAPTURE_FILTER: "${CAPTURE_FILTER:-tcp port 1550}"
      ROTATE_SECONDS: "${ROTATE_SECONDS:-3600}"
    volumes:
      - ../../../runs/docker-pi:/lab_output
    restart: unless-stopped
