services:
  pi-mllp-detector:
    container_name: pi-mllp-detector
    build:
      context: ../../..
      dockerfile: deploy/docker/raspberry/Dockerfile
    network_mode: host
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      LAB_AUTHORIZED: "YES"
      CAPTURE_INTERFACE: "${CAPTURE_INTERFACE:-eth0}"
      WATO_IP: "${WATO_IP:-192.168.5.114}"
      MLLP_PORT: "${MLLP_PORT:-1550}"
      CAPTURE_OUTDIR: "/lab_output"
      # IP extra opcional SOLO para la campaña interna. La topologia WATO
      # puede dejarse vacia: el emisor benigno usa loopback local.
      EXTRA_ALLOWED_IPS: "${EXTRA_ALLOWED_IPS:-}"
      CAPTURE_FILTER: "${CAPTURE_FILTER:-tcp port 1550}"
      ROTATE_SECONDS: "${ROTATE_SECONDS:-3600}"
    volumes:
      - ../../../runs/docker-pi:/lab_output
    restart: unless-stopped
