services:
  wato:
    build:
      context: ../../..
      dockerfile: deploy/docker/simwato/Dockerfile
    environment:
      LAB_AUTHORIZED: "YES"
    ports:
      - "0.0.0.0:1550:1550"
    command:
      - python
      - mllp_receiver.py
      - --host
      - 0.0.0.0
      - --port
      - "1550"
      - --verbose
      - --outdir
      - /lab_output/wato
    volumes:
      - ../../../runs/docker-wato:/lab_output
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;s=socket.create_connection(('127.0.0.1',1550),2);s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - wato-lab
    restart: unless-stopped

  # Emisor benigno dentro de la red Compose. El receptor se resuelve por
  # el nombre de servicio "wato"; no usa localhost ni una IP fisica del host.
  wato-benign:
    build:
      context: ../../..
      dockerfile: deploy/docker/simwato/Dockerfile
    environment:
      LAB_AUTHORIZED: "YES"
    depends_on:
      wato:
        condition: service_healthy
    command:
      - python
      - wato_emulator.py
      - --host
      - "${WATO_RECEIVER_HOST:-wato}"
      - --port
      - "1550"
      - --bind-host
      - "${WATO_BIND_HOST:-0.0.0.0}"
      - --state
      - "${WATO_STATE:-STANDBY}"
      - --vent-mode
      - "${WATO_VENT_MODE:-VCV}"
      - --count
      - "${WATO_COUNT:-0}"
      - --interval
      - "${WATO_INTERVAL:-10.0}"
      - --ack-timeout
      - "5"
      - --max-reconnects
      - "0"
    networks:
      - wato-lab

networks:
  wato-lab:
    name: simwato-lab
