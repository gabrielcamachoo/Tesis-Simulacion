services:
  wato:
    build:
      context: ../../..
      dockerfile: deploy/docker/simwato/Dockerfile
    network_mode: host
    environment:
      LAB_AUTHORIZED: "YES"
    command:
      - python
      - mllp_receiver.py
      - --host
      - 0.0.0.0
      - --port
      - "1550"
      - --verbose
      - --outdir
      - /lab_output/wato
    volumes:
      - ../../../runs/docker-wato:/lab_output
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket;s=socket.create_connection(('192.168.5.114',1550),2);s.close()\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Emisor benigno de la misma maquina WATO (.114). Sale por la IP fisica
  # del equipo para que el switch pueda ver el flujo y copiarlo al puerto SPAN.
  wato-benign:
    build:
      context: ../../..
      dockerfile: deploy/docker/simwato/Dockerfile
    network_mode: host
    environment:
      LAB_AUTHORIZED: "YES"
    depends_on:
      wato:
        condition: service_healthy
    command:
      - python
      - wato_emulator.py
      - --host
      - "${WATO_RECEIVER_HOST:-192.168.5.114}"
      - --port
      - "1550"
      - --bind-host
      - "${WATO_BIND_HOST:-192.168.5.114}"
      - --state
      - "${WATO_STATE:-STANDBY}"
      - --vent-mode
      - "${WATO_VENT_MODE:-VCV}"
      - --count
      - "${WATO_COUNT:-0}"
      - --interval
      - "${WATO_INTERVAL:-10.0}"
      - --ack-timeout
      - "5"
      - --max-reconnects
      - "0"
