services:
  wato:
    build:
      context: ../../..
      dockerfile: deploy/docker/simwato/Dockerfile
    network_mode: host
    environment:
      LAB_AUTHORIZED: "YES"
    command:
      - python
      - mllp_receiver.py
      - --host
      - 0.0.0.0
      - --port
      - "1550"
      - --verbose
      - --outdir
      - /lab_output/wato
    volumes:
      - ../../../runs/docker-wato:/lab_output
    restart: unless-stopped

  # Prueba local de humo: el emisor manda a 127.0.0.1 en ESTA máquina, así
  # que su tráfico NO pasa por el switch y la Pi no lo ve. Para la prueba con
  # la Pi use deploy/docker/simemisor desde otra máquina.
  wato-benign:
    profiles: ["benign"]
    build:
      context: ../../..
      dockerfile: deploy/docker/simwato/Dockerfile
    network_mode: host
    environment:
      LAB_AUTHORIZED: "YES"
    command:
      - python
      - wato_emulator.py
      - --host
      - "${WATO_RECEIVER_HOST:-127.0.0.1}"
      - --port
      - "1550"
      - --state
      - "${WATO_STATE:-STANDBY}"
      - --vent-mode
      - "${WATO_VENT_MODE:-VCV}"
      - --count
      - "${WATO_COUNT:-0}"
      - --interval
      - "${WATO_INTERVAL:-10.0}"
      - --ack-timeout
      - "5"
      - --max-reconnects
      - "0"
