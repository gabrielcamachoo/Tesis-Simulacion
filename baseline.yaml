fsm_states:
  SIN_GATEWAY:
    description: Descubrimiento ARP y reintentos SYN sin respuesta (gateway no disponible,
      observado en 18-08 y 25-08)
    observed_duration_range:
    - 0
    - 299
    # Enmienda E7 (2026-10-20): ciclo SYN medido en LECTURA25AGOSYO.pcapng
    # (sha256 cd9122c67bd3082c...), 19 ciclos, puertos 2048-2066
    # 192.168.23.250 -> 192.168.23.200:1550. Antes decía 'SYN cada ~30s'.
    behavior: ARP Who has 192.168.23.200? Tell 192.168.23.250; por puerto efímero SYN en t=0, reintentos a +1.6 s, +16.6 s y +31.6 s, RST del WATO a +46.6 s; nuevo SYN con puerto+1 a +47.6 s (ciclo ~47.6 s)
  HANDSHAKE:
    description: Establecimiento TCP exitoso hacia puerto 1550
    observed_duration_range:
    - 0
    - 2
    behavior: SYN -> SYN-ACK -> ACK, luego primer ORU^R01 MLLP
  SESION_ESTABLECIDA_STANDBY:
    description: Sesión persistente en modo STANDBY con ORU^R01 periódicos + ACK (25-08
      msg 1..43, 27-08 msg 1..13)
    observed_duration_range:
    - 0
    - 509
    behavior: ORU^R01 cada 10.000s exactos, ACK MSA|AA en <1ms, 4 segmentos OBX CWE
    message_profile:
      type: ORU^R01^ORU_R01
      interval_seconds: 10.0
      ack_required: true
      ack_type: AL
      obx_count: 4
      obx_types:
      - CWE
      - CWE
      - CWE
      - CWE
  SESION_ESTABLECIDA_RUNNING:
    description: Sesión activa de ventilación mecánica (27-08 msg 14..99) en modos
      VCV, SIMV-VC+PS, PCV, SIMV-PC+PS, PS y MANUAL
    observed_duration_range:
    - 0
    - 860
    behavior: ORU^R01 cada 10.000s con 17 a 28 segmentos OBX (5 CWE estado/modo +
      0..11 ajustes F + 12 mediciones R/X)
    message_profile:
      type: ORU^R01^ORU_R01
      interval_seconds: 10.0
      ack_required: true
      ack_type: AL
      obx_count_range:
      - 17
      - 28
      obx_types:
      - CWE
      - NM
      - SN
    # Enmienda E2 (pruebas-santi): 184352^MDC_VENT_MODE presente en 86/86 ORU
    # RUNNING y 0/56 STANDBY (LECTURAACK27AGOSTO). R-STATE-001 exige este OBX
    # cuando el mensaje declara RUNNING (estado falso sin datos de ventilación).
    required_obx_codes:
    - '184352'
